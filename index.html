<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover"/>
<title>Mental Health Mentorship Program</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#FAFAFC;
    --surface:#F1EEF8;
    --surface-2:#E6E1F2;
    --ink:#241C33;
    --ink-soft:#6B6379;
    --primary:#4E2E84;
    --primary-dark:#382061;
    --primary-tint:#EDE9F7;
    --primary-light:#9384D6;
    --accent:#F6A93C;
    --accent-tint:#FDF0DC;
    --danger:#B24A3E;
    --danger-tint:#F6E4E0;
    --border:#E4DFF0;
    --bubble-me:#4E2E84;
    --bubble-them:#EFEDF8;
    --grad-primary:linear-gradient(135deg,#5B3796 0%,#432571 100%);
    --grad-accent:linear-gradient(135deg,#F8B85A 0%,#F09B2E 100%);
    --shadow-sm:0 1px 2px rgba(56,32,97,.06), 0 1px 1px rgba(56,32,97,.04);
    --shadow-md:0 6px 16px rgba(56,32,97,.08), 0 2px 6px rgba(56,32,97,.05);
    --shadow-lg:0 16px 40px rgba(56,32,97,.14), 0 4px 12px rgba(56,32,97,.06);
    --shadow-glow:0 0 0 4px rgba(78,46,132,.1);
  }
  *{box-sizing:border-box;}
  #mhp-root{
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 480px at 12% -8%, rgba(147,132,214,.16), transparent 60%),
      radial-gradient(700px 420px at 100% 0%, rgba(246,169,60,.10), transparent 55%),
      var(--bg);
    min-height:100vh;
    width:100%;
    display:flex;
    flex-direction:column;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  #mhp-root h1,#mhp-root h2,#mhp-root h3{
    font-family:'Fraunces',serif;
    font-weight:500;
    margin:0 0 6px 0;
    letter-spacing:-0.015em;
  }
  #mhp-root .shell{width:100%;flex:1;display:flex;flex-direction:column;animation:mhpfadein .35s ease;}
  @keyframes mhpfadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  #mhp-root button{
    font-family:'Inter',sans-serif;
    cursor:pointer;
    border:none;
    border-radius:11px;
    padding:11px 18px;
    font-size:14px;
    font-weight:600;
    transition:transform .12s cubic-bezier(.2,.9,.3,1.2), box-shadow .18s ease, background .18s ease, opacity .15s ease;
  }
  #mhp-root button:disabled{opacity:.55;cursor:default;}
  #mhp-root button:active{transform:scale(0.96);}
  #mhp-root .btn-primary{background:var(--grad-primary);color:#fff;box-shadow:var(--shadow-sm);}
  #mhp-root .btn-primary:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
  #mhp-root .btn-ghost{background:#fff;color:var(--ink-soft);border:1px solid var(--border);}
  #mhp-root .btn-ghost:hover{background:var(--surface);border-color:var(--primary-light);color:var(--primary-dark);}
  #mhp-root .btn-danger{background:var(--danger);color:#fff;box-shadow:var(--shadow-sm);}
  #mhp-root input, #mhp-root textarea{
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:11px 13px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#fff;
    width:100%;
    color:var(--ink);
    transition:box-shadow .15s ease, border-color .15s ease;
  }
  #mhp-root input:focus, #mhp-root textarea:focus{outline:none;border-color:var(--primary);box-shadow:var(--shadow-glow);}
  #mhp-root label{font-size:13px;color:var(--ink-soft);font-weight:600;display:block;margin-bottom:5px;}
  #mhp-root .field{margin-bottom:14px;}
  #mhp-root .card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:var(--shadow-sm);transition:box-shadow .2s ease;}
  #mhp-root .muted{color:var(--ink-soft);font-size:13.5px;}
  #mhp-root a.linklike{color:var(--primary);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
  #mhp-root .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;}
  #mhp-root .pill-open{background:var(--danger-tint);color:var(--danger);}
  #mhp-root .pill-resolved{background:var(--primary-tint);color:var(--primary-dark);}
  #mhp-root .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:13px 22px;margin:14px auto 12px;border-radius:18px;
    max-width:1600px;width:calc(100% - 36px);
    border:1px solid var(--border);background:rgba(255,255,255,.78);
    backdrop-filter:blur(10px);box-shadow:var(--shadow-md);
    position:sticky;top:14px;z-index:10;
  }
  #mhp-root .topbar .brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-size:19px;}
  #mhp-root .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(246,169,60,.22);}
  #mhp-root .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);background:#fff;padding:0 24px;}
  #mhp-root .student-nav{display:flex;gap:4px;flex:1;justify-content:center;}
  #mhp-root .student-nav-link{font-family:'Inter',sans-serif;background:transparent;border:none;padding:9px 15px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:color .15s ease, background .15s ease;white-space:nowrap;}
  #mhp-root .student-nav-link:hover{color:var(--primary-dark);background:var(--surface);}
  #mhp-root .student-nav-link.active{color:var(--primary-dark);background:var(--primary-tint);}
  #mhp-root .mobile-tabs-fallback{display:none;}
  #mhp-root .tab{padding:14px 6px;margin-right:22px;font-weight:600;font-size:14px;color:var(--ink-soft);border-bottom:2px solid transparent;cursor:pointer;transition:color .15s ease, border-color .15s ease;}
  #mhp-root .tab:hover{color:var(--primary-dark);}
  #mhp-root .tab.active{color:var(--primary-dark);border-bottom-color:var(--primary);}
  #mhp-root .content{flex:1;padding:26px 24px;display:flex;flex-direction:column;max-width:1600px;margin:0 auto;width:100%;}
  #mhp-root .centerbox{max-width:420px;margin:48px auto;width:100%;}
  #mhp-root .msg-row{display:flex;margin-bottom:9px;}
  #mhp-root .msg-row.me{justify-content:flex-end;}
  #mhp-root .bubble{max-width:70%;padding:10px 14px;border-radius:14px;font-size:14.5px;line-height:1.42;box-shadow:var(--shadow-sm);}
  #mhp-root .bubble.me{background:var(--grad-primary);color:#fff;border-bottom-right-radius:4px;}
  #mhp-root .bubble.them{background:var(--bubble-them);color:var(--ink);border-bottom-left-radius:4px;box-shadow:none;border:1px solid var(--border);}
  #mhp-root .bubble .ts{display:block;font-size:10.5px;margin-top:4px;opacity:.65;}
  #mhp-root .chat-panel{display:flex;flex-direction:column;height:60vh;border:1px solid var(--border);border-radius:18px;overflow:hidden;background:#fff;box-shadow:var(--shadow-md);}
  #mhp-root .chat-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,#fff,var(--surface));}
  #mhp-root .chat-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;}
  #mhp-root .chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);background:#fff;}
  #mhp-root .chat-input input{flex:1;}
  #mhp-root .mentee-item{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border:1px solid var(--border);border-radius:13px;margin-bottom:8px;cursor:pointer;background:#fff;transition:border-color .15s ease, box-shadow .15s ease, transform .12s ease;}
  #mhp-root .mentee-item:hover{border-color:var(--primary-light);box-shadow:var(--shadow-sm);transform:translateY(-1px);}
  #mhp-root .mentor-chats-layout{display:flex;gap:18px;}
  #mhp-root .mentor-chats-sidebar{width:220px;flex-shrink:0;}
  #mhp-root .admin-chats-layout{display:flex;gap:18px;}
  #mhp-root .admin-chats-col{width:190px;flex-shrink:0;}
  #mhp-root .two-col-form{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  #mhp-root .mentee-item.active{border-color:var(--primary);background:var(--primary-tint);box-shadow:var(--shadow-sm);}
  #mhp-root table{width:100%;border-collapse:collapse;font-size:13.5px;}
  #mhp-root th{text-align:left;color:var(--ink-soft);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--border);font-size:12.5px;text-transform:none;}
  #mhp-root td{padding:10px 10px;border-bottom:1px solid var(--surface-2);}
  #mhp-root tr:hover td{background:var(--surface);}
  #mhp-root .role-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;max-width:760px;margin:40px auto;}
  #mhp-root .role-card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:26px 20px;text-align:left;cursor:pointer;transition:border-color .2s ease, box-shadow .2s ease, transform .2s cubic-bezier(.2,.9,.3,1.2);box-shadow:var(--shadow-sm);position:relative;overflow:hidden;}
  #mhp-root .role-card::before{content:"";position:absolute;inset:0;background:var(--grad-primary);opacity:0;transition:opacity .2s ease;z-index:0;}
  #mhp-root .role-card:hover{border-color:transparent;box-shadow:var(--shadow-lg);transform:translateY(-3px);}
  #mhp-root .role-card:hover::before{opacity:1;}
  #mhp-root .role-card > *{position:relative;z-index:1;}
  #mhp-root .role-card:hover h3, #mhp-root .role-card:hover p{color:#fff;}
  #mhp-root .empty{padding:40px 20px;text-align:center;color:var(--ink-soft);}
  #mhp-root .hint{background:var(--primary-tint);border:1px solid var(--border);border-radius:12px;padding:10px 13px;font-size:12.5px;color:var(--primary-dark);margin-bottom:16px;}
  #mhp-root .banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-tint);border-bottom:1px solid var(--border);padding:10px 24px;font-size:13.5px;color:var(--primary-dark);}
  #mhp-root .banner-admin{background:var(--primary-tint);border-bottom:1px solid var(--border);border-left:4px solid var(--primary);align-items:flex-start;padding:14px 24px;}
  #mhp-root .announcement-label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--primary);margin-bottom:3px;}
  #mhp-root .anon-badge{font-family:'Fraunces',serif;font-weight:600;font-size:16px;}
  #mhp-root .spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--primary);animation:mhpspin .7s linear infinite;margin:0 auto;}
  #mhp-root .info-hero-pro{text-align:center;padding:36px 20px 24px;transition:transform .1s linear;position:relative;z-index:1;}
  #mhp-root .info-page{margin:-26px -24px;position:relative;overflow:hidden;}
  #mhp-root .info-blob{position:absolute;border-radius:50%;filter:blur(64px);pointer-events:none;opacity:.4;z-index:0;}
  #mhp-root .info-blob-1{width:340px;height:340px;background:radial-gradient(circle,var(--primary-light),transparent 70%);top:-100px;left:-100px;animation:blobFloat1 19s ease-in-out infinite;}
  #mhp-root .info-blob-2{width:280px;height:280px;background:radial-gradient(circle,var(--accent),transparent 70%);top:38%;right:-110px;animation:blobFloat2 23s ease-in-out infinite;}
  #mhp-root .info-blob-3{width:300px;height:300px;background:radial-gradient(circle,var(--primary),transparent 70%);bottom:-80px;left:18%;animation:blobFloat3 27s ease-in-out infinite;}
  @keyframes blobFloat1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(50px,60px) scale(1.15);}}
  @keyframes blobFloat2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-40px,50px) scale(.9);}}
  @keyframes blobFloat3{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(40px,-40px) scale(1.1);}}
  #mhp-root .info-kicker{position:relative;display:inline-block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--primary);margin-bottom:14px;padding-bottom:9px;}
  #mhp-root .info-kicker::after{content:"";position:absolute;left:0;bottom:0;width:26px;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .6s cubic-bezier(.16,.84,.44,1) .18s;}
  #mhp-root .info-block.is-visible .info-kicker::after{transform:scaleX(1);}
  #mhp-root .info-block{position:relative;z-index:1;padding:58px 24px;opacity:0;transform:translateY(30px);transition:opacity .8s cubic-bezier(.16,.84,.44,1), transform .8s cubic-bezier(.16,.84,.44,1);}
  #mhp-root .info-block.is-visible{opacity:1;transform:translateY(0);}
  #mhp-root .info-block-inner{max-width:760px;margin:0 auto;}
  #mhp-root .info-block h2{font-size:24px;margin-bottom:12px;}
  #mhp-root .info-block h3{font-size:17px;margin-bottom:8px;}
  #mhp-root .info-block p{color:var(--ink-soft);line-height:1.8;font-size:14.5px;margin:0;}
  #mhp-root .info-block h2 .rw, #mhp-root .info-block h3 .rw{display:inline-block;opacity:0;transform:translateY(14px);transition:opacity .55s cubic-bezier(.16,.84,.44,1), transform .55s cubic-bezier(.16,.84,.44,1);}
  #mhp-root .info-block.is-visible h2 .rw, #mhp-root .info-block.is-visible h3 .rw{opacity:1;transform:translateY(0);}
  #mhp-root .info-row{display:grid;grid-template-columns:180px 1fr;gap:44px;align-items:center;}
  #mhp-root .info-row.info-row-reverse{grid-template-columns:1fr 180px;}
  #mhp-root .info-row.info-row-reverse .info-visual{order:2;}
  #mhp-root .info-visual{display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.82);transition:opacity .7s cubic-bezier(.16,.84,.44,1), transform .7s cubic-bezier(.16,.84,.44,1);}
  #mhp-root .info-block.is-visible .info-visual{opacity:1;transform:scale(1);}
  #mhp-root .info-visual svg{width:100%;height:auto;max-width:150px;}
  #mhp-root .info-split{display:grid;grid-template-columns:1fr 1fr;gap:48px;}
  #mhp-root .info-split-icon{width:34px;height:34px;margin-bottom:10px;opacity:0;transform:scale(.7);transition:opacity .6s cubic-bezier(.16,.84,.44,1), transform .6s cubic-bezier(.16,.84,.44,1);}
  #mhp-root .info-block.is-visible .info-split-icon{opacity:1;transform:scale(1);}
  #mhp-root .info-split > div:first-child{opacity:0;transform:translateX(-26px);transition:opacity .75s cubic-bezier(.16,.84,.44,1) .08s, transform .75s cubic-bezier(.16,.84,.44,1) .08s;}
  #mhp-root .info-split > div:last-child{opacity:0;transform:translateX(26px);transition:opacity .75s cubic-bezier(.16,.84,.44,1) .08s, transform .75s cubic-bezier(.16,.84,.44,1) .08s;}
  #mhp-root .info-block.is-visible .info-split > div:first-child,
  #mhp-root .info-block.is-visible .info-split > div:last-child{opacity:1;transform:translateX(0);}
  #mhp-root .info-process{display:flex;align-items:flex-start;justify-content:center;gap:0;margin:30px 0 6px;}
  #mhp-root .info-process-step{display:flex;flex-direction:column;align-items:center;gap:11px;width:150px;}
  #mhp-root .info-process-circle{width:54px;height:54px;border-radius:50%;background:var(--grad-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:20px;font-weight:600;box-shadow:var(--shadow-sm);flex-shrink:0;}
  #mhp-root .info-process-label{font-size:12.5px;color:var(--ink-soft);text-align:center;line-height:1.4;}
  #mhp-root .info-process-line{flex:1;max-width:90px;height:2px;background:var(--border);position:relative;top:27px;transform:scaleX(0);transform-origin:left;transition:transform .8s cubic-bezier(.16,.84,.44,1) .35s;}
  #mhp-root .info-block.is-visible .info-process-line{transform:scaleX(1);}
  #mhp-root .info-nav{position:relative;z-index:1;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 20px 8px;}
  #mhp-root .info-nav-pill{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;color:var(--ink-soft);background:#fff;border:1px solid var(--border);border-radius:999px;padding:7px 16px;cursor:pointer;transition:all .25s cubic-bezier(.16,.84,.44,1);}
  #mhp-root .info-nav-pill:hover{border-color:var(--primary-light);color:var(--primary-dark);transform:translateY(-1px);}
  #mhp-root .info-nav-pill.active{background:var(--grad-primary);color:#fff;border-color:transparent;animation:pillPulse 2.6s ease-in-out infinite;}
  @keyframes pillPulse{0%,100%{box-shadow:0 0 0 0 rgba(78,46,132,.18);}50%{box-shadow:0 0 0 7px rgba(78,46,132,0);}}
  #mhp-root .info-cta{position:relative;z-index:1;text-align:center;padding:60px 24px 20px;opacity:0;transform:translateY(20px);transition:opacity .7s cubic-bezier(.16,.84,.44,1), transform .7s cubic-bezier(.16,.84,.44,1);}
  #mhp-root .info-cta.is-visible{opacity:1;transform:translateY(0);}
  #mhp-root .info-cta h2{font-size:22px;margin-bottom:10px;}
  #mhp-root .info-cta p{color:var(--ink-soft);margin-bottom:20px;}
  #mhp-root .info-cta .btn-primary{animation:ctaGlow 3.2s ease-in-out infinite;}
  @keyframes ctaGlow{0%,100%{box-shadow:var(--shadow-sm);}50%{box-shadow:0 0 0 9px rgba(78,46,132,.07), var(--shadow-md);}}
  @media (max-width:860px){
    #mhp-root .student-nav{display:none;}
    #mhp-root .mobile-tabs-fallback{display:flex;gap:4px;border-bottom:1px solid var(--border);background:#fff;padding:0 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
    #mhp-root .mobile-tabs-fallback .tab{margin-right:14px;padding:12px 4px;white-space:nowrap;font-size:13.5px;}
  }
  @media (max-width:640px){
    #mhp-root .info-split{grid-template-columns:1fr;gap:30px;}
    #mhp-root .info-block{padding:40px 20px;}
    #mhp-root .info-nav{padding:0 16px 6px;}
    #mhp-root .info-blob{display:none;}
    #mhp-root .info-row, #mhp-root .info-row.info-row-reverse{grid-template-columns:1fr;text-align:center;gap:18px;}
    #mhp-root .info-row.info-row-reverse .info-visual{order:0;}
    #mhp-root .info-visual svg{max-width:110px;}
    #mhp-root .info-process{flex-direction:column;gap:18px;}
    #mhp-root .info-process-line{display:none;}
  }
  @keyframes mhpspin{to{transform:rotate(360deg);}}
  @media (max-width:640px){
    #mhp-root .role-grid{grid-template-columns:1fr;margin:24px auto;}
    #mhp-root .bubble{max-width:85%;}
    #mhp-root .mentor-chats-layout,
    #mhp-root .admin-chats-layout{flex-direction:column;}
    #mhp-root .mentor-chats-sidebar,
    #mhp-root .admin-chats-col{width:100%;}
    #mhp-root .two-col-form{grid-template-columns:1fr;}
    #mhp-root .topbar{padding:11px 16px;margin:10px 10px 10px;width:calc(100% - 20px);border-radius:15px;top:10px;flex-wrap:wrap;row-gap:8px;}
    #mhp-root .topbar .brand{font-size:17px;}
    #mhp-root .tabs{padding:0 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
    #mhp-root .tab{margin-right:16px;padding:12px 4px;white-space:nowrap;font-size:13.5px;}
    #mhp-root .content{padding:16px;}
    #mhp-root .info-page{margin:-16px -16px;}
    #mhp-root .banner{padding:10px 16px;}
    #mhp-root .banner-admin{padding:12px 16px;}
    #mhp-root .centerbox{margin:20px auto;}
    #mhp-root .card{padding:18px;}
    #mhp-root .role-card{padding:20px 16px;}
    #mhp-root h1{font-size:24px !important;}
    #mhp-root h2{font-size:20px;}
    #mhp-root button{padding:12px 16px;min-height:44px;}
    #mhp-root input, #mhp-root textarea, #mhp-root select{padding:12px;font-size:16px;min-height:44px;}
    #mhp-root textarea{min-height:100px;}
    #mhp-root .chat-panel{height:calc(100dvh - 190px);border-radius:12px;}
    #mhp-root table{font-size:12.5px;}
    #mhp-root th, #mhp-root td{padding:8px 6px;}
  }
  @media (max-width:380px){
    #mhp-root .topbar .brand{font-size:15px;}
    #mhp-root h1{font-size:21px !important;}
  }
  html,body{margin:0;padding:0;}
</style>
</head>
<body>

<div id="mhp-root"></div>

<script type="module">
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, addDoc, collection, query, where,
  onSnapshot, orderBy, limit, serverTimestamp, runTransaction, increment, documentId, arrayUnion
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ---------- Firebase project config ----------
const firebaseConfig = {

(function(){
  window.MHP = window.MHP || {};
  const root = document.getElementById('mhp-root');

  let S = { view:'boot', role:null, uid:null, profile:null, tab:'chat', adminTab:'students',
            activeMenteeUid:null, adminActiveMentor:null, adminActiveMentee:null, issueCategory:null,
            authBusy:false, showAddStudents:false, showAddMentor:false, showSendNotif:false,
            toast:null, adminNotifs:[], notifRecipients:{ boys:[], girls:[], mentorsBoy:[], mentorsGirl:[] } };

  let liveUnsubs = [];
  function clearLiveListeners(){ liveUnsubs.forEach(u => { try{u();}catch(e){} }); liveUnsubs = []; }
  function track(unsub){ liveUnsubs.push(unsub); }

  function esc(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtTime(ts){
    if(!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' · ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
  }
  function pairKey(studentUid, mentorUid){ return studentUid + '_' + mentorUid; }

  // --- unread tracking: a lightweight parent doc at messages/{pairKey} holds
  // lastMessageTs, plus a per-side unread COUNT that increments when the other side
  // sends a message and resets to 0 when that side opens the conversation.
  async function markRead(key, readField, unreadField){
    try{ await setDoc(doc(fs,'messages',key), { [readField]: serverTimestamp(), [unreadField]: 0 }, { merge:true }); }catch(e){}
  }
  async function bumpLastMessage(key, senderReadField, senderUnreadField, otherUnreadField){
    try{
      await setDoc(doc(fs,'messages',key), {
        lastMessageTs: serverTimestamp(),
        [senderReadField]: serverTimestamp(),
        [senderUnreadField]: 0,
        [otherUnreadField]: increment(1)
      }, { merge:true });
    }catch(e){}
  }
  function chunk(arr, size){
    const out=[]; for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size)); return out;
  }
  function unreadCountOf(data, unreadField){
    return (data && data[unreadField]) || 0;
  }
  // Watches unread counts for a batch of pairKeys at once; calls cb with a { pairKey: number } map
  // on every change. Chunked into groups of 30 (Firestore's "in" query limit).
  function watchUnread(pairKeys, unreadField, cb){
    if(pairKeys.length===0){ cb({}); return ()=>{}; }
    const groups = chunk(pairKeys, 30);
    const state = {};
    const unsubs = groups.map(g => {
      const q = query(collection(fs,'messages'), where(documentId(),'in',g));
      return onSnapshot(q, (qs) => {
        g.forEach(k => { state[k] = 0; });
        qs.docs.forEach(d => { state[d.id] = unreadCountOf(d.data(), unreadField); });
        cb({...state});
      });
    });
    return () => unsubs.forEach(u=>u());
  }
  function unreadBadge(count){
    if(!count || count<=0) return '';
    return `<span style="display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;margin-left:6px;vertical-align:middle;">${count>99?'99+':count}</span>`;
  }

  function studentEmail(id){ return id.toLowerCase() + '@' + STUDENT_DOMAIN; }
  function mentorEmail(slug){ return slug + '@' + MENTOR_DOMAIN; }
  function slugify(name){ return name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'mentor'; }
  const PASSWORD_CHARS = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789"; // no 0/O/1/I/l
  function genPassword(len=8){
    let p = '';
    for(let i=0;i<len;i++) p += PASSWORD_CHARS[Math.floor(Math.random()*PASSWORD_CHARS.length)];
    return p;
  }

  // ---------- generic error helper ----------
  function friendlyAuthError(e){
    const code = e && e.code || '';
    if(code.includes('email-already-in-use')) return 'That account already exists — try logging in instead.';
    if(code.includes('wrong-password') || code.includes('invalid-credential')) return 'Incorrect ID/name or password.';
    if(code.includes('user-not-found')) return 'No account found — check your details or sign up.';
    if(code.includes('weak-password')) return 'Password must be at least 6 characters.';
    if(code.includes('too-many-requests')) return 'Too many attempts — please wait a moment and try again.';
    return e && e.message ? e.message : 'Something went wrong. Please try again.';
  }

  // ---------- transactional counters doc: just keeps anonymous names unique ----------
  async function pickAnonName(){
    const ref = doc(fs, 'meta', 'counters');
    return await runTransaction(fs, async (tx) => {
      const snap = await tx.get(ref);
      const data = snap.exists() ? snap.data() : { usedNames:[] };
      const used = new Set(data.usedNames || []);
      let name;
      do { name = 'Anonymous' + String(Math.floor(1000 + Math.random()*9000)); } while (used.has(name));
      tx.set(ref, { usedNames: [...used, name] });
      return name;
    });
  }

  // Finds the mentor of the given gender currently assigned the fewest mentees,
  // then atomically bumps their count. Returns null if no mentor of that gender exists yet.
  async function assignLeastLoadedMentor(gender){
    const q = query(collection(fs,'mentors'), where('gender','==',gender), orderBy('menteeCount','asc'), limit(1));
    const qs = await getDocs(q);
    if(qs.empty) return null;
    const mentorUid = qs.docs[0].id;
    await updateDoc(doc(fs,'mentors',mentorUid), { menteeCount: increment(1) });
    return mentorUid;
  }

  function findGender(nameOrId, whitelistData){
    const target = String(nameOrId).trim().toLowerCase();
    const boys = (whitelistData.boys || []).map(x => String(x).trim().toLowerCase());
    const girls = (whitelistData.girls || []).map(x => String(x).trim().toLowerCase());
    if(boys.includes(target)) return 'boy';
    if(girls.includes(target)) return 'girl';
    return null;
  }

  // ---------- render dispatch ----------
  function render(){
    clearLiveListeners();
    if(S.view==='boot') return renderBoot();
    if(S.view==='landing') return renderLanding();
    if(S.view==='studentSignup') return renderStudentSignup();
    if(S.view==='studentLogin') return renderStudentLogin();
    if(S.view==='studentInfo') return renderStudentInfo();
    if(S.view==='studentMain') return renderStudentMain();
    if(S.view==='mentorAuth') return renderMentorAuth();
    if(S.view==='mentorHome') return renderMentorHome();
    if(S.view==='adminAuth') return renderAdminAuth();
    if(S.view==='adminHome') return renderAdminHome();
    renderLanding();
  }

  function topbar(title, onBack, showWhatsapp){
    return `<div class="topbar">
      <div class="brand"><span class="dot"></span> ${esc(title)}</div>
      <div style="display:flex;align-items:center;gap:10px;">
        ${showWhatsapp ? whatsappPill() : ''}
        ${onBack ? `<button class="btn-ghost" onclick="${onBack}">Log out</button>` : ''}
      </div>
    </div>`;

  // Subscribes to broadcast notifications targeted at the current user, filtered against
  // what they've already dismissed. Call from any screen that should surface them.
  function watchMyNotifications(){
    const dismissed = new Set(S.profile.dismissedNotifs || []);
    const q = query(collection(fs,'notifications'), where('targetUids','array-contains', S.uid));
    const unsub = onSnapshot(q, (qs) => {
      const items = qs.docs.filter(d=>!dismissed.has(d.id)).map(d=>({id:d.id, ...d.data()}));
      items.sort((a,b) => (b.createdAt?.toMillis?.()||0) - (a.createdAt?.toMillis?.()||0));
      S.adminNotifs = items;
      const el = document.getElementById('banner-area');
      if(el) el.innerHTML = renderBanners();
    });
    track(unsub);
  }
  // One-time check on login/restore: is there already an unread chat message waiting?
  async function checkChatToast(){
    S.toast = null; // always start fresh — a stale toast from a previous session must never carry over
    try{
      if(S.role==='student'){
        if(!S.profile.mentorId) return;
        const key = pairKey(S.uid, S.profile.mentorId);
        const msnap = await getDoc(doc(fs,'messages',key));
        const cnt = unreadCountOf(msnap.exists()?msnap.data():null, 'unreadForStudent');
        if(cnt>0){
          const mSnap = await getDoc(doc(fs,'mentors',S.profile.mentorId));
          const name = mSnap.exists() ? mSnap.data().name : 'Your mentor';
          S.toast = `${name} sent you ${cnt} new message${cnt>1?'s':''}.`;
        }
      } else if(S.role==='mentor'){
        const menteesSnap = await getDocs(query(collection(fs,'students'), where('mentorId','==',S.uid)));
        const pairKeys = menteesSnap.docs.map(d => pairKey(d.id, S.uid));
        if(pairKeys.length===0) return;
        let total = 0;
        for(const g of chunk(pairKeys,30)){
          const qs = await getDocs(query(collection(fs,'messages'), where(documentId(),'in',g)));
          qs.docs.forEach(d => { total += unreadCountOf(d.data(), 'unreadForMentor'); });
        }
        if(total>0) S.toast = `You have ${total} new message${total>1?'s':''} from your mentees.`;
      }
    }catch(e){}
  }

    // Content should never be stuck invisible — reveal the section that's on screen right
    // now immediately (not just on the next scroll event), and as a safety net, force
    // everything visible shortly after load regardless, in case detection never fires.
    revealTargets.forEach(b => {
      const r = b.getBoundingClientRect();
      if(r.top < window.innerHeight && r.bottom > 0) b.classList.add('is-visible');
    });
    if('IntersectionObserver' in window){
      // Two-way: reveal when a section scrolls into view, fade back out when it scrolls away —
      // so the effect replays whichever direction the person is scrolling.
      const io = new IntersectionObserver((entries) => {
        entries.forEach(en => {
          en.target.classList.toggle('is-visible', en.isIntersecting);
          if(en.isIntersecting && en.target.id){
            navPills.forEach(pill => pill.classList.toggle('active', pill.dataset.target===en.target.id));
          }
        });
      }, { threshold: 0.08 });
      revealTargets.forEach(b => io.observe(b));
      track(() => io.disconnect());
    } else {
      revealTargets.forEach(b => b.classList.add('is-visible'));
    }
    setTimeout(() => { revealTargets.forEach(b => b.classList.add('is-visible')); }, 1500);
    // Subtle parallax on the hero as the page scrolls.
    const heroEl = c.querySelector('.info-hero-pro');
    if(heroEl){
      let ticking = false;
      const updateParallax = () => {
        ticking = false;
        const rect = heroEl.getBoundingClientRect();
        const offset = Math.max(-24, Math.min(24, rect.top * -0.12));
        heroEl.style.transform = `translateY(${offset}px)`;
      };
      const onScroll = () => { if(!ticking){ ticking = true; requestAnimationFrame(updateParallax); } };
      window.addEventListener('scroll', onScroll, { passive:true });
      track(() => window.removeEventListener('scroll', onScroll));
      updateParallax();
    }
    // Magnetic pull on the closing CTA button — it nudges toward the cursor when nearby.
    const ctaBtn = c.querySelector('#info-cta-btn');
    if(ctaBtn){
      const onMove = (e) => {
        const rect = ctaBtn.getBoundingClientRect();
        const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
        const dx = e.clientX - cx, dy = e.clientY - cy;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const radius = 130;
        if(dist < radius){
          const strength = (1 - dist/radius) * 9;
          ctaBtn.style.transform = `translate(${(dx/dist)*strength||0}px, ${(dy/dist)*strength||0}px)`;
        } else {
          ctaBtn.style.transform = 'translate(0,0)';
        }
      };
      window.addEventListener('mousemove', onMove, { passive:true });
      track(() => window.removeEventListener('mousemove', onMove));
    }
  }

  function mergeUnique(existing, incoming){

    return merged;
  }

    const errBox = document.getElementById('add-students-err');

    if(boysNew.length===0 && girlsNew.length===0){ errBox.innerHTML = '<div class="hint" style="background:var(--danger-tint);color:var(--danger);">Paste at least one ID first.</div>'; return; }
    btn.disabled = true; btn.textContent = 'Saving…';
    try{
      const snap = await getDoc(doc(fs,'meta','whitelist'));
      const existing = snap.exists() ? snap.data() : {};
      const mergedBoys = mergeUnique(existing.boys || [], boysNew);
      const mergedGirls = mergeUnique(existing.girls || [], girlsNew);
      await setDoc(doc(fs,'meta','whitelist'), { boys: mergedBoys, girls: mergedGirls });
      S.showAddStudents = false;
      renderAdminStudents();
    }catch(e){
      errBox.innerHTML = `<div class="hint" style="background:var(--danger-tint);color:var(--danger);">${esc(e.message)}</div>`;

                  <td style="white-space:nowrap;">
                    <button class="btn-ghost" style="padding:5px 10px;font-size:12.5px;" onclick="MHP.resetMentorPassword('${m.uid}','${esc(m.name)}','${esc(m.gender||'boy')}')">Reset password</button>
                    <button class="btn-ghost" style="padding:5px 10px;font-size:12.5px;" onclick="MHP.deleteMentor('${m.uid}','${esc(m.name)}')">Delete</button>
                  </td>
                </tr>
                <tr id="reset-row-${m.uid}" style="display:none;"><td colspan="5"><div id="reset-box-${m.uid}"></div></td></tr>`).join('')}
            </tbody>
          </table>
        </div>
        </div>`;
    }, (e) => { if(c) c.innerHTML = `<div class="empty">Couldn't load mentors (${esc(e.message)}).</div>`; });
    track(unsub);
  }

  MHP.toggleAddMentor = function(){ S.showAddMentor = !S.showAddMentor; renderAdminMentors(); };

  MHP.createMentorFromAdmin = async function(){
    const name = document.getElementById('new-mentor-name').value.trim();
    const gender = document.getElementById('new-mentor-gender').value;
    const password = document.getElementById('new-mentor-pw').value;
    const errBox = document.getElementById('add-mentor-err');
    const resultBox = document.getElementById('new-mentor-result');
    const btn = document.getElementById('add-mentor-btn');
    errBox.innerHTML = ''; resultBox.innerHTML = '';
    if(!name){ errBox.innerHTML = '<div class="hint" style="background:var(--danger-tint);color:var(--danger);">Enter a name.</div>'; return; }
    if(!password || password.length < 6){ errBox.innerHTML = '<div class="hint" style="background:var(--danger-tint);color:var(--danger);">Enter a password of at least 6 characters.</div>'; return; }
    btn.disabled = true; btn.textContent = 'Creating…';
    const slug = slugify(name);
    const email = mentorEmail(slug);
    // Throwaway secondary app instance so this doesn't sign the admin out of their own session.
    const secondary = initializeApp(firebaseConfig, 'creator-' + Date.now() + '-' + Math.random().toString(36).slice(2));
    const secondaryAuth = getAuth(secondary);
    try{
      const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
      await setDoc(doc(fs,'mentors',cred.user.uid), { name, gender, menteeCount: 0, createdAt: serverTimestamp() });
      await signOut(secondaryAuth).catch(()=>{});
      await deleteApp(secondary).catch(()=>{});
      resultBox.innerHTML = `<div class="hint">Created. ${esc(name)} can now log in with the name and password you just set.</div>`;
      document.getElementById('new-mentor-name').value = '';
      document.getElementById('new-mentor-pw').value = '';
      btn.disabled=false; btn.textContent='Create account';
    }catch(e){
      await deleteApp(secondary).catch(()=>{});
      errBox.innerHTML = `<div class="hint" style="background:var(--danger-tint);color:var(--danger);">${esc(e.message)}</div>`;
      btn.disabled=false; btn.textContent='Create account';
    }
  };

  // Resetting another user's password can't be done purely client-side (no backend/Admin SDK here),
  // so this is a two-step dance: free up their login in the Firebase console, then recreate it here
  // with the password you choose — their existing mentees are automatically re-pointed, nothing else changes.
  MHP.resetMentorPassword = function(uid, name, gender){
    const row = document.getElementById('reset-row-'+uid);
    const box = document.getElementById('reset-box-'+uid);
    row.style.display = 'table-row';
    box.innerHTML = `
      <div class="hint" style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;">
        <div style="flex:1;min-width:200px;">
          <label style="margin-bottom:4px;">New password for ${esc(name)}</label>
          <input id="reset-pw-${uid}" type="text" placeholder="At least 6 characters"/>
        </div>
        <button class="btn-primary" onclick="MHP.confirmResetMentorPassword('${uid}','${esc(name)}','${esc(gender)}')">Confirm</button>
        <button class="btn-ghost" onclick="document.getElementById('reset-row-${uid}').style.display='none';">Cancel</button>
      </div>`;
  };

  MHP.confirmResetMentorPassword = async function(uid, name, gender){
    const box = document.getElementById('reset-box-'+uid);
    const password = document.getElementById('reset-pw-'+uid).value;
    if(!password || password.length < 6){
      box.innerHTML = `<div class="hint" style="background:var(--danger-tint);color:var(--danger);">Enter a password of at least 6 characters.</div>`;
      return;
    }
    box.innerHTML = `<div class="hint">Working…</div>`;
    try{
      const menteesSnap = await getDocs(query(collection(fs,'students'), where('mentorId','==',uid)));
      const menteeUids = menteesSnap.docs.map(d => d.id);
      const slug = slugify(name);
      const email = mentorEmail(slug);
      const secondary = initializeApp(firebaseConfig, 'reset-' + Date.now() + '-' + Math.random().toString(36).slice(2));
      const secondaryAuth = getAuth(secondary);
      try{
        const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
        // Succeeded — the old login must already be gone. Finish the swap.
        await setDoc(doc(fs,'mentors',cred.user.uid), { name, gender, menteeCount: menteeUids.length, createdAt: serverTimestamp() });
        await deleteDoc(doc(fs,'mentors',uid));
        for(const menteeUid of menteeUids){
          await updateDoc(doc(fs,'students',menteeUid), { mentorId: cred.user.uid });
        }
        await signOut(secondaryAuth).catch(()=>{});
        await deleteApp(secondary).catch(()=>{});
        box.innerHTML = `<div class="hint">Done. ${esc(name)} can now log in with the new password you set. Their ${menteeUids.length} mentee(s) stayed assigned to them.</div>`;
      }catch(e){
        await deleteApp(secondary).catch(()=>{});
        if(e.code && e.code.includes('email-already-in-use')){
          box.innerHTML = `<div class="hint">
            One manual step needed first: go to Firebase Console → Authentication → Users, find
            <strong>${esc(email)}</strong>, and delete that account — that's ${esc(name)}'s current login, and it has to
            be freed up before a new password can be issued. Nothing here has been changed yet.<br><br>
            Once you've deleted it there, click Reset password again for ${esc(name)} to finish.
          </div>`;
        } else {
          box.innerHTML = `<div class="hint" style="background:var(--danger-tint);color:var(--danger);">${esc(e.message)}</div>`;
        }
      }
    }catch(e){
      box.innerHTML = `<div class="hint" style="background:var(--danger-tint);color:var(--danger);">${esc(e.message)}</div>`;
    }
  };

  MHP.deleteMentor = async function(uid, name){
    if(!confirm(`Remove ${name}? Any current mentees will be automatically reassigned to another mentor of the same gender, or marked as waiting if none are available.`)) return;
    try{
      const menteesSnap = await getDocs(query(collection(fs,'students'), where('mentorId','==',uid)));
      const mentees = menteesSnap.docs.map(d => ({ uid:d.id, ...d.data() }));
      await deleteDoc(doc(fs,'mentors',uid));
      for(const mentee of mentees){
        const newMentor = await assignLeastLoadedMentor(mentee.gender);
        await updateDoc(doc(fs,'students',mentee.uid), { mentorId: newMentor || null });
      }
    }catch(e){ alert('Could not delete: ' + e.message); }
  };

  function renderAdminChats(){
    const c = document.getElementById('admin-tab-content');
    const unsub = onSnapshot(collection(fs,'mentors'), (mSnap) => {
      const mentors = mSnap.docs.map(d => ({ uid:d.id, ...d.data() }));
      if(!S.adminActiveMentor && mentors.length>0) S.adminActiveMentor = mentors[0].uid;
      const activeMentorUid = S.adminActiveMentor;
      const unsubStudents = onSnapshot(
        activeMentorUid ? query(collection(fs,'students'), where('mentorId','==',activeMentorUid)) : collection(fs,'students'),
        (sSnap) => {
          if(!c) return;
          const mentees = activeMentorUid ? sSnap.docs.map(d => ({ uid:d.id, ...d.data() })) : [];
          if(!S.adminActiveMentee && mentees.length>0) S.adminActiveMentee = mentees[0].uid;
          const pairKeys = activeMentorUid ? mentees.map(u => pairKey(u.uid, activeMentorUid)) : [];
          const unwatch = watchUnread(pairKeys, 'unreadForMentor', (map) => {
            S.adminUnreadMap = map;
            paintAdminChatsList(mentors, activeMentorUid, mentees);
          });
          track(unwatch);
          paintAdminChatsList(mentors, activeMentorUid, mentees);
        }, (e) => { if(c) c.innerHTML = `<div class="empty">Couldn't load mentees (${esc(e.message)}).</div>`; }
      );
      track(unsubStudents);
    }, (e) => { if(c) c.innerHTML = `<div class="empty">Couldn't load mentors (${esc(e.message)}).</div>`; });
    track(unsub);
  }

  function paintAdminChatsList(mentors, activeMentorUid, mentees){
    const c = document.getElementById('admin-tab-content');
    if(!c) return;
    const map = S.adminUnreadMap || {};
    c.innerHTML = `
      <div style="max-width:1180px;margin:0 auto;">
      <div class="admin-chats-layout">
        <div class="admin-chats-col">
          <p class="muted" style="margin-bottom:8px;">Mentors</p>
          ${mentors.length===0 ? '<p class="muted">None registered.</p>' : mentors.map(m => `
            <div class="mentee-item ${m.uid===activeMentorUid?'active':''}" style="display:block;" onclick="MHP.setAdminMentor('${m.uid}')">${esc(m.name)}</div>`).join('')}
        </div>
        <div class="admin-chats-col">
          <p class="muted" style="margin-bottom:8px;">Mentees</p>
          ${mentees.length===0 ? '<p class="muted">None.</p>' : mentees.map(u => `
            <div class="mentee-item ${u.uid===S.adminActiveMentee?'active':''}" style="display:block;" onclick="MHP.setAdminMentee('${u.uid}')"><span class="anon-badge" style="font-size:13.5px;">${esc(u.anonName)}${unreadBadge(map[pairKey(u.uid,activeMentorUid)])}</span></div>`).join('')}
        </div>
        <div style="flex:1;min-width:0;" id="admin-chat-panel"></div>
      </div>
      </div>`;
    renderAdminChatPanel(activeMentorUid, mentors.find(m=>m.uid===activeMentorUid), mentees.find(u=>u.uid===S.adminActiveMentee));
  }

  function renderAdminChatPanel(mentorUid, mentor, mentee){
    const panel = document.getElementById('admin-chat-panel');
    if(!panel) return;
    if(!mentorUid || !mentor || !mentee){ panel.innerHTML = '<div class="empty card">Select a mentor and mentee to view the conversation.</div>'; return; }
    panel.innerHTML = `<div class="chat-panel"><div class="chat-header"><strong>${esc(mentor.name)} ↔ <span class="anon-badge" style="font-size:15px;">${esc(mentee.anonName)}</span></strong></div><div class="chat-body" id="admin-chat-body"><div class="empty">Loading…</div></div></div><p class="muted" style="margin-top:8px;">Read-only view for oversight. The dot next to a mentee's name means the mentor hasn't opened that chat since the last message.</p>`;
    const key = pairKey(mentee.uid, mentorUid);
    const q = query(collection(fs,'messages',key,'thread'), orderBy('ts','asc'));
    const unsub = onSnapshot(q, (qs) => {
      const body = document.getElementById('admin-chat-body');
      if(!body) return;
      if(qs.empty){ body.innerHTML = '<div class="empty">No messages yet.</div>'; return; }
      body.innerHTML = qs.docs.map(d => {
        const m = d.data();
        return `<div class="msg-row ${m.from==='mentor'?'me':''}"><div class="bubble ${m.from==='mentor'?'me':'them'}">${esc(m.text)}<span class="ts">${fmtTime(m.ts)}</span></div></div>`;
      }).join('');
    });
    track(unsub);
  }

  MHP.setAdminMentor = function(uid){ S.adminActiveMentor = uid; S.adminActiveMentee = null; render(); };
  MHP.setAdminMentee = function(uid){ S.adminActiveMentee = uid; render(); };

  function renderAdminIssues(){
    const c = document.getElementById('admin-tab-content');
    const unsub = onSnapshot(collection(fs,'issues'), (qs) => {
      if(!c) return;
      const issues = qs.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b)=> (b.ts?.toMillis?.()||0)-(a.ts?.toMillis?.()||0));
      c.innerHTML = `<div style="max-width:720px;">
        ${issues.length===0 ? '<p class="muted">No issues reported.</p>' : issues.map(i => `
          <div class="card" style="margin-bottom:10px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
              <div style="display:flex;align-items:center;gap:10px;">
                <span class="anon-badge" style="font-size:14px;">${esc(i.anonName)}</span>
                <span style="font-size:12px;font-weight:600;color:var(--primary-dark);background:var(--primary-tint);padding:3px 9px;border-radius:999px;">${esc(categoryLabel(i.category))}</span>
              </div>
              <span class="pill ${i.status==='open'?'pill-open':'pill-resolved'}">${i.status}</span>
            </div>
            ${i.text ? `<p style="margin:0 0 10px;">${esc(i.text)}</p>` : '<p class="muted" style="margin:0 0 10px;">No additional details provided.</p>'}
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span class="muted">${fmtTime(i.ts)}</span>
              ${i.status==='open' ? `<button class="btn-ghost" onclick="MHP.resolveIssue('${i.id}')">Mark resolved</button>` : ''}
            </div>
          </div>`).join('')}
      </div>`;
    }, (e) => { if(c) c.innerHTML = `<div class="empty">Couldn't load issues (${esc(e.message)}).</div>`; });
    track(unsub);
  }

  MHP.resolveIssue = async function(id){
    try{ await updateDoc(doc(fs,'issues',id), { status:'resolved' }); }
    catch(e){ alert('Could not update: ' + e.message); }
  };

  // ---------- ADMIN: NOTIFICATIONS ----------
  function renderAdminNotifications(){
    const unsubS = onSnapshot(collection(fs,'students'), (sSnap) => {
      const students = sSnap.docs.map(d => ({ uid:d.id, ...d.data() }));
      const unsubM = onSnapshot(collection(fs,'mentors'), (mSnap) => {
        const mentors = mSnap.docs.map(d => ({ uid:d.id, ...d.data() }));
        paintAdminNotifications(students, mentors);
      });
      track(unsubM);
    });
    track(unsubS);
  }

  function paintAdminNotifications(students, mentors){
    const c = document.getElementById('admin-tab-content');
    if(!c) return;
    c.innerHTML = `
      <div style="max-width:680px;margin:0 auto;">
      <div class="card">
        <h3>Send a notification</h3>
        <p class="muted">Shows up as a dismissible banner for whoever you select, the next time they're on the platform.</p>
        <div class="field"><textarea id="notif-text" rows="3" placeholder="Write your message…"></textarea></div>
        <div id="notif-err"></div>
        <div style="display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;">
          <button class="btn-ghost" onclick="MHP.toggleAllNotifCheckboxes('student',true)">Select all students</button>
          <button class="btn-ghost" onclick="MHP.toggleAllNotifCheckboxes('mentor',true)">Select all mentors</button>
          <button class="btn-ghost" onclick="MHP.toggleAllNotifCheckboxes('all',false)">Clear all</button>
        </div>
        <div class="two-col-form" style="max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;padding:12px;">
          <div>
            <p class="muted" style="margin-bottom:6px;font-weight:600;">Students (${students.length})</p>
            ${students.length===0 ? '<p class="muted">None yet.</p>' : students.map(u => `<label style="display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;"><input type="checkbox" class="notif-cb notif-cb-student" value="${u.uid}"/> ${esc(u.anonName)}</label>`).join('')}
          </div>
          <div>
            <p class="muted" style="margin-bottom:6px;font-weight:600;">Mentors (${mentors.length})</p>
            ${mentors.length===0 ? '<p class="muted">None yet.</p>' : mentors.map(m => `<label style="display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;"><input type="checkbox" class="notif-cb notif-cb-mentor" value="${m.uid}"/> ${esc(m.name)}</label>`).join('')}
          </div>
        </div>
        <button class="btn-primary" style="margin-top:14px;" id="send-notif-btn" onclick="MHP.sendNotification()">Send notification</button>
      </div>
      <div style="margin-top:22px;">
        <h3 style="font-size:15px;">Recently sent</h3>
        <div id="notif-history"><p class="muted">Loading…</p></div>
      </div>
      </div>`;
    const unsub = onSnapshot(collection(fs,'notifications'), (qs) => {
      const hist = document.getElementById('notif-history');
      if(!hist) return;
      const items = qs.docs.map(d => ({ id:d.id, ...d.data() }))
        .sort((a,b) => (b.createdAt?.toMillis?.()||0) - (a.createdAt?.toMillis?.()||0)).slice(0,15);
      hist.innerHTML = items.length===0 ? '<p class="muted">None yet.</p>' : items.map(n => `
        <div class="card" style="margin-bottom:8px;padding:14px;">
          <div style="margin-bottom:4px;">${esc(n.text)}</div>
          <div class="muted">${fmtTime(n.createdAt)} · sent to ${n.targetUids ? n.targetUids.length : 0} recipient(s)</div>
        </div>`).join('');
    }, (e) => { const hist=document.getElementById('notif-history'); if(hist) hist.innerHTML = `<p class="muted">Couldn't load history (${esc(e.message)}).</p>`; });
    track(unsub);
  }

  MHP.toggleAllNotifCheckboxes = function(type, checked){
    const selector = type==='student' ? '.notif-cb-student' : type==='mentor' ? '.notif-cb-mentor' : '.notif-cb';
    document.querySelectorAll(selector).forEach(cb => { cb.checked = checked; });
  };

  MHP.sendNotification = async function(){
    const text = document.getElementById('notif-text').value.trim();
    const errBox = document.getElementById('notif-err');
    const btn = document.getElementById('send-notif-btn');
    errBox.innerHTML = '';
    const targetUids = Array.from(document.querySelectorAll('.notif-cb:checked')).map(cb => cb.value);
    if(!text){ errBox.innerHTML = '<div class="hint" style="background:var(--danger-tint);color:var(--danger);">Write a message first.</div>'; return; }
    if(targetUids.length===0){ errBox.innerHTML = '<div class="hint" style="background:var(--danger-tint);color:var(--danger);">Select at least one recipient.</div>'; return; }
    btn.disabled = true; btn.textContent = 'Sending…';
    try{
      await addDoc(collection(fs,'notifications'), { text, targetUids, createdAt: serverTimestamp(), createdBy: S.uid });
      document.getElementById('notif-text').value = '';
      document.querySelectorAll('.notif-cb').forEach(cb => { cb.checked = false; });
      btn.disabled=false; btn.textContent='Send notification';
    }catch(e){
      errBox.innerHTML = `<div class="hint" style="background:var(--danger-tint);color:var(--danger);">${esc(e.message)}</div>`;
      btn.disabled=false; btn.textContent='Send notification';
    }
  };

  // ---------- shared nav ----------
  MHP.go = function(view){ S.view = view; render(); };
  MHP.enterStudentApp = function(){ S.view='studentMain'; S.tab='info'; render(); };
  MHP.setTab = function(tab){ S.tab = tab; render(); };
  MHP.setAdminTab = function(tab){ S.adminTab = tab; render(); };
  MHP.logout = async function(){
    await signOut(auth);
    S.role=null; S.uid=null; S.profile=null; S.view='landing';
    S.activeMenteeUid=null; S.adminActiveMentor=null; S.adminActiveMentee=null; S.issueCategory=null;
    S.toast=null; S.adminNotifs=[]; S.mentorUnreadMap={}; S.adminUnreadMap={};
    render();
  };

  // ---------- auth state restore ----------
  onAuthStateChanged(auth, async (user) => {
    if(S.authBusy) return;
    if(!user){
      if(S.role){ S.role=null; S.uid=null; S.profile=null; S.view='landing'; render(); }
      else if(S.view==='boot'){ S.view='landing'; render(); }
      return;
    }
    if(S.role && S.uid===user.uid) return; // already handled by an explicit login/signup flow
    S.authBusy = true;
    try{
      if(user.email === ADMIN_EMAIL){
        S.role='admin'; S.uid=user.uid; S.profile={ email:user.email }; S.view='adminHome'; S.adminTab='students';
      } else {
        const sSnap = await getDoc(doc(fs,'students',user.uid));
        if(sSnap.exists()){
          S.role='student'; S.uid=user.uid; S.profile=sSnap.data(); S.view='studentMain'; S.tab='chat';
          await checkChatToast();
        } else {
          const mSnap = await getDoc(doc(fs,'mentors',user.uid));
          if(mSnap.exists()){
            S.role='mentor'; S.uid=user.uid; S.profile=mSnap.data(); S.view='mentorHome'; S.tab='mentees';
            await checkChatToast();
          } else {
            // Not admin, no student doc, no mentor doc: an interrupted signup. Sign out and let them retry cleanly.
            await signOut(auth); S.view='landing';
          }
        }
      }
    }catch(e){
      S.view='landing';
    }
    S.authBusy = false;
    render();
  });

  render(); // shows the boot spinner until onAuthStateChanged fires
})();
</script>
</body>
